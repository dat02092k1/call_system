[global]
type=global
user_agent=TCBS-Local-Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[2001]
type=endpoint
transport=transport-ws
context=from-demo
disallow=all
allow=ulaw,alaw
auth=auth-2001
aors=2001
webrtc=yes
dtls_auto_generate_cert=yes
media_use_received_transport=yes
rtcp_mux=yes
ice_support=yes

[auth-2001]
type=auth
auth_type=userpass
username=2001
password=demo2001

[2001]
type=aor
max_contacts=1
remove_existing=yes

[2002]
type=endpoint
transport=transport-udp
context=from-demo
disallow=all
allow=ulaw,alaw
auth=auth-2002
aors=2002
direct_media=no

[auth-2002]
type=auth
auth_type=userpass
username=2002
password=demo2002

[2002]
type=aor
max_contacts=1
remove_existing=yes
