services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1 --redis-host redis:6379
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-secret}
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
        health_port: 8083
        logging:
          level: info
    volumes:
      - ./recordings:/out
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

  token-api:
    build:
      context: ./apps/token-api
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PORT: 3001
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  sip:
    image: livekit/sip:latest
    network_mode: host
    environment:
      SIP_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-secret}
        ws_url: ws://host.docker.internal:7880
        redis:
          address: host.docker.internal:6379
        sip_port: 5070
        rtp_port: 10000-10100
        use_external_ip: false
        health_port: 8082
        logging:
          level: debug
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

  sip-bootstrap:
    build:
      context: ./apps/token-api
    command: npm run sip:bootstrap
    environment:
      LIVEKIT_HTTP_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: "no"

  call-orchestrator:
    build:
      context: ./apps/call-orchestrator
    environment:
      PORT: 3002
    ports:
      - "3002:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  agent:
    build:
      context: ./apps/agent-py
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      CALL_ORCHESTRATOR_URL: http://call-orchestrator:3002
    ports:
      - "8081:8081"
    depends_on:
      livekit:
        condition: service_started
      egress:
        condition: service_started
      call-orchestrator:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; r=urllib.request.urlopen('http://localhost:8081', timeout=2); sys.exit(0 if 200 <= r.status < 300 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  voice-bridge:
    build:
      context: ./apps/voice-bridge
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      VOICE_BRIDGE_PORT: 8091
      MEDIA_START_TIMEOUT_MS: 5000
      AGENT_START_TIMEOUT_MS: 20000
      MAX_AUDIO_BUFFER_MS: 500
    ports:
      - "8091:8091"
    depends_on:
      livekit:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  mock-asterisk:
    build:
      context: ./apps/mock-asterisk
    environment:
      PORT: 8090
      VOICE_BRIDGE_URL: ws://voice-bridge:8091/media
      CALL_START_TIMEOUT_MS: 5000
    ports:
      - "8090:8090"
    depends_on:
      voice-bridge:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8090/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  asterisk:
    build:
      context: ./apps/asterisk
      args:
        ASTERISK_VERSION: 22.11.0
    network_mode: host
    volumes:
      - ./apps/asterisk/config:/etc/asterisk:ro
      - asterisk-spool:/var/spool/asterisk
      - asterisk-logs:/var/log/asterisk
    depends_on:
      voice-bridge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "asterisk-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    environment:
      VITE_TOKEN_API_URL: ${VITE_TOKEN_API_URL:-http://localhost:3001}
      VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL:-ws://localhost:7880}
      VITE_MOCK_ASTERISK_URL: ${VITE_MOCK_ASTERISK_URL:-ws://localhost:8090/call}
      VITE_ASTERISK_WS_URL: ${VITE_ASTERISK_WS_URL:-ws://localhost:8088/ws}
      VITE_ASTERISK_DOMAIN: ${VITE_ASTERISK_DOMAIN:-localhost}
      VITE_ASTERISK_EXTENSION: ${VITE_ASTERISK_EXTENSION:-2001}
      VITE_ASTERISK_PASSWORD: ${VITE_ASTERISK_PASSWORD:-demo2001}
      VITE_ASTERISK_DESTINATION: ${VITE_ASTERISK_DESTINATION:-1000}
    ports:
      - "5173:5173"
    depends_on:
      token-api:
        condition: service_healthy
      mock-asterisk:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  asterisk-spool:
  asterisk-logs:
